<!doctype html>
<html lang="km">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#24201C" />
    <meta name="color-scheme" content="light" />
    <!-- Filled in from src/config/wedding.ts at build time (vite.config.ts → weddingMeta). -->
    <title>%WEDDING_TITLE%</title>
    <meta name="description" content="%WEDDING_DESCRIPTION%" />
    <meta property="og:title" content="%WEDDING_TITLE%" />
    <meta property="og:description" content="%WEDDING_DATE%" />
    <meta property="og:type" content="website" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      /* Pre-paint colour so the opening never flashes white. */
      html, body { background: #1b1714; }
    </style>
  </head>
  <body>
    <noscript>This invitation needs JavaScript enabled.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
